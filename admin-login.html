<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ÉLAN BOUTIQUE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-body">

<div class="admin-login-page">

    <div class="admin-login-card">

        <a href="index.html" class="brand-logo admin-logo">
            <span class="brand-name">ÉLAN</span>
            <span class="brand-subtitle">BOUTIQUE</span>
        </a>

        <p class="eyebrow">ADMINISTRATION</p>

        <h1>Welcome Back</h1>

        <p class="login-subtitle">
            Sign in to manage your boutique.
        </p>

        <form>

            <label>Email Address</label>
            <input type="email" placeholder="admin@elanboutique.com" required>

            <label>Password</label>
            <input type="password" placeholder="Enter password" required>

            <div class="remember-row">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <a href="admin-dashboard.html" class="primary-btn admin-login-btn">
                Sign In →
            </a>

        </form>

        <a href="index.html" class="back-home">
            ← Back to Website
        </a>

    </div>

</div>

    <script src="app.js"></script>
</body>
</html>

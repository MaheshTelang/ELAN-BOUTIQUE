<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | ÉLAN BOUTIQUE</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --wine: #762f4f;
            --wine-dark: #542139;
            --rose: #c87591;
            --pink: #f3d9df;
            --cream: #fffaf7;
            --white: #ffffff;
            --dark: #282127;
            --gray: #766f73;
            --border: #eadbdd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background: var(--cream);
            color: var(--dark);
        }

        .contact-section {
            min-height: 100vh;
            padding: 80px 8%;
            display: flex;
            align-items: center;
        }

        .contact-container {
            width: 100%;
            max-width: 1320px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            align-items: start;
        }

        /* LEFT SIDE */

        .contact-left {
            padding-top: 10px;
        }

        .contact-label {
            color: var(--rose);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .contact-title {
            font-family: "Playfair Display", serif;
            font-size: 64px;
            line-height: 1.05;
            font-weight: 600;
            margin-bottom: 45px;
        }

        .contact-title span {
            color: var(--wine);
            font-style: italic;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .contact-icon {
            width: 58px;
            height: 58px;
            min-width: 58px;
            border-radius: 50%;
            background: var(--pink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .contact-text h3 {
            font-size: 17px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .contact-text p {
            color: var(--gray);
            font-size: 16px;
            line-height: 1.5;
        }

        /* FORM CARD */

        .contact-form-card {
            background: var(--white);
            border-radius: 30px;
            padding: 48px 50px;
            box-shadow: 0 25px 60px rgba(75, 36, 53, 0.10);
        }

        .contact-form-card h2 {
            font-family: "Playfair Display", serif;
            font-size: 38px;
            margin-bottom: 45px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: #fffdfc;
            padding: 20px;
            font-family: "DM Sans", sans-serif;
            font-size: 16px;
            color: var(--dark);
            outline: none;
            transition: 0.3s;
        }

        .form-group input {
            height: 70px;
        }

        .form-group textarea {
            height: 260px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--rose);
            box-shadow: 0 0 0 3px rgba(200, 117, 145, 0.10);
        }

        .send-btn {
            display: inline-block;
            border: none;
            background: var(--wine);
            color: white;
            padding: 20px 36px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.3s;
        }

        .send-btn:hover {
            background: var(--wine-dark);
            transform: translateY(-2px);
        }

        /* RESPONSIVE */

        @media (max-width: 1000px) {
            .contact-container {
                grid-template-columns: 1fr;
                gap: 50px;
            }

            .contact-title {
                font-size: 52px;
            }

            .contact-form-card {
                max-width: 750px;
            }
        }

        @media (max-width: 650px) {
            .contact-section {
                padding: 55px 20px;
            }

            .contact-title {
                font-size: 42px;
            }

            .contact-form-card {
                padding: 30px 22px;
                border-radius: 22px;
            }

            .contact-form-card h2 {
                font-size: 30px;
                margin-bottom: 30px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-group textarea {
                height: 200px;
            }
        }
    </style>
</head>

<body>

<section class="contact-section">

    <div class="contact-container">

        <!-- LEFT SIDE -->
        <div class="contact-left">

            <div class="contact-label">
                Contact Details
            </div>

            <h1 class="contact-title">
                We'd Love To <span>Hear<br>From You</span>
            </h1>

            <div class="contact-info">

                <!-- VISIT -->
                <div class="contact-item">

                    <div class="contact-icon">
                        📍
                    </div>

                    <div class="contact-text">
                        <h3>Visit Us</h3>
                        <p>Hyderabad IDPL</p>
                    </div>

                </div>

                <!-- CALL -->
                <div class="contact-item">

                    <div class="contact-icon">
                        ☎
                    </div>

                    <div class="contact-text">
                        <h3>Call Us</h3>
                        <p>+91 9916659291</p>
                    </div>

                </div>

                <!-- EMAIL -->
                <div class="contact-item">

                    <div class="contact-icon">
                        ✉
                    </div>

                    <div class="contact-text">
                        <h3>Email</h3>
                        <p>telangm11@gmail.com</p>
                    </div>

                </div>

                <!-- OPENING HOURS -->
                <div class="contact-item">

                    <div class="contact-icon">
                        ◷
                    </div>

                    <div class="contact-text">
                        <h3>Opening Hours</h3>
                        <p>Monday – Saturday, 10 AM – 8 PM</p>
                    </div>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="contact-form-card">

            <h2>Send Us A Message</h2>

            <form>

                <div class="form-row">

                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" placeholder="Your name">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="Your email">
                    </div>

                </div>


                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" placeholder="How can we help?">
                </div>


                <div class="form-group">
                    <label>Message</label>
                    <textarea placeholder="Write your message..."></textarea>
                </div>


                <button type="submit" class="send-btn">
                    Send Message →
                </button>

            </form>

        </div>

    </div>

</section>

    <script src="app.js"></script>
</body>
</html>
